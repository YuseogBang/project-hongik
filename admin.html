<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>홍대맵 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
body{margin:0;padding:20px;background:#2b070c;color:#f5ece7;font-family:Pretendard,sans-serif}main{max-width:1000px;margin:auto}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}header a{color:#ffb7aa}section{margin:18px 0;padding:20px;background:#3d0f16;border:1px solid #7a2534;border-radius:16px}h1{margin:10px 0}h2{margin:0 0 14px;font-size:19px}p,.muted{color:#c39298;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#2b070c;border:1px solid #7a2534;border-radius:12px;padding:14px}.stat b{display:block;font-size:27px}.stat span{font-size:12px;color:#c39298}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border-radius:9px;border:1px solid #7a2534;background:#2b070c;color:#fff;font:13px Pretendard,sans-serif}label{display:grid;gap:6px;font-size:13px}form{display:grid;gap:10px}button{padding:9px 13px;border:0;border-radius:9px;background:#e8362a;color:white;font:700 12px Pretendard,sans-serif;cursor:pointer}.secondary{background:#63313a}.row{padding:12px 0;border-bottom:1px solid #7a2534;overflow-wrap:anywhere}.row:last-child{border:0}.row small{color:#c39298}.bars{display:flex;align-items:end;gap:4px;height:110px;padding:10px 0}.bars div{flex:1;min-width:4px;background:#e8362a;border-radius:3px 3px 0 0}.actions{display:flex;gap:7px;margin-top:9px}.empty{color:#c39298;font-size:13px}
</style></head><body><main><header><a href="main.html">← 지도 돌아가기</a><h1>홍대맵 관리자</h1></header><p id="state">관리자 계정을 확인하고 있어요.</p><div id="admin" hidden>
<section><h2>최근 30일 관심도</h2><p class="muted">로그인 사용자의 업체 조회, 컬렉션 저장, 길찾기 실행을 집계합니다. 비로그인 활동은 포함되지 않습니다.</p><div id="metrics" class="stats"></div><div id="trend" class="bars" aria-label="최근 30일 일별 관심도"></div><h3>관심 업체 순위</h3><div id="top-places"></div></section>
<section><h2>리뷰 관리</h2><p class="muted">부적절한 리뷰는 숨김 처리할 수 있습니다. 삭제는 되돌릴 수 없습니다.</p><div id="reviews"></div></section>
<section><h2>장소 등록</h2><form id="place-form"><div class="grid"><label>상호명<input name="name" required></label><label>업종<select name="type"><option value="restaurant">음식점</option><option value="cafe">카페</option><option value="bar">주점</option><option value="retail">의류·소품·서점</option><option value="club">클럽</option><option value="liveclub">공연장·라이브 바</option><option value="practice">합주·연습실</option><option value="play">놀거리</option><option value="artsupply">화방</option><option value="entertainment">엔터테인먼트</option></select></label></div><div class="grid"><label>위도<input name="lat" type="number" step="any" required></label><label>경도<input name="lng" type="number" step="any" required></label></div><label>주소<input name="address"></label><label>세부 카테고리<input name="category"></label><div class="grid"><label>영업 상태<select name="status"><option value="unverified">확인 필요</option><option value="open">영업 중</option><option value="closed">영업 종료</option><option value="risk">주의</option></select></label><label>동네<select name="dong"><option value="">미기재</option><option>서교동</option><option>연남동</option><option>합정동</option><option>상수동</option><option>동교동</option><option>망원동</option></select></label></div><label>영업시간<input name="hours" placeholder="확인한 영업시간만 입력"></label><label>대표 메뉴<input name="signatureMenu"></label><label>해시태그<input name="tags" placeholder="혼밥, 빈티지, 독립출판"></label><label>프랜차이즈 여부<select name="franchise"><option value="unknown">미확인</option><option value="yes">프랜차이즈</option><option value="no">로컬 독립 브랜드</option></select></label><div class="actions"><button id="place-submit">장소 등록</button><button type="button" class="secondary" id="place-cancel" hidden>수정 취소</button></div></form><h3>최근 등록 장소</h3><div id="places"></div></section>
<section><h2>사용자 제보</h2><div id="feedbacks"></div></section>
</div></main><script type="module" src="admin-dashboard.js?v=20261004-managed"></script></body></html>
