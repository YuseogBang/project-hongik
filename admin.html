<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>홍대맵 관리자</title><style>
body{margin:0;padding:24px;background:#2b070c;color:#f5ece7;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;background:#3d0f16;border:1px solid #7a2534;border-radius:16px;padding:24px}p{color:#c39298;line-height:1.6}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #7a2534;background:#2b070c;color:#fff}label{display:grid;gap:6px;font-size:13px}form{display:grid;gap:12px}button,a{padding:10px 14px;border:0;border-radius:8px;background:#e8362a;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.place{padding:12px 0;border-bottom:1px solid #7a2534}
</style></head><body><main><a href="main.html">← 지도 돌아가기</a><h1>홍대맵 관리자</h1><p id="state">로그인 상태를 확인 중이에요.</p><section id="admin" hidden><h2>장소 등록</h2><form id="place-form"><div class="grid"><label>상호명<input name="name" required></label><label>업종<select name="type"><option value="restaurant">음식점</option><option value="cafe">카페</option><option value="bar">주점</option><option value="retail">기타</option></select></label></div><div class="grid"><label>위도<input name="lat" type="number" step="any" required></label><label>경도<input name="lng" type="number" step="any" required></label></div><label>주소<input name="address"></label><label>세부 카테고리<input name="category"></label><button>장소 등록</button></form><h2>최근 등록 장소</h2><div id="places"></div><h2>사용자 피드백</h2><div id="feedbacks"></div></section></main><script type="module">
const state=document.querySelector('#state'), admin=document.querySelector('#admin'), places=document.querySelector('#places'), feedbacks=document.querySelector('#feedbacks');
const config=await fetch('/api/auth-config').then(r=>r.json()).catch(()=>null);
if(!config?.configured){state.textContent='Supabase 연결 전입니다. SUPABASE_SETUP.md의 설정을 완료하세요.';throw new Error('not configured')}
const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const sb=createClient(config.url,config.anonKey);const {data:{user}}=await sb.auth.getUser();
if(!user){state.innerHTML='관리자 기능은 로그인 후 사용할 수 있어요. <a href="main.html">지도에서 로그인</a>';throw new Error('no user')}
const {data:profile}=await sb.from('profiles').select('role,display_name').eq('id',user.id).single();
if(profile?.role!=='admin'){state.textContent='관리자 권한이 없는 계정입니다.';throw new Error('not admin')}
state.textContent=`${profile.display_name || user.email} 관리자님, 장소를 관리할 수 있어요.`;admin.hidden=false;
async function render(){const {data,error}=await sb.from('places').select('id,name,type,status,address,updated_at').order('updated_at',{ascending:false}).limit(30);places.innerHTML=error?error.message:(data.length?data.map(p=>`<div class="place"><b>${p.name}</b> · ${p.type} · ${p.status}<br><small>${p.address||'주소 없음'}</small></div>`).join(''):'등록된 장소가 없어요.')}
async function renderFeedback(){const {data,error}=await sb.from('feedbacks').select('id,type,message,contact,status,created_at').order('created_at',{ascending:false}).limit(100);feedbacks.innerHTML=error?`피드백 테이블을 먼저 생성하세요: ${error.message}`:(data.length?data.map(f=>`<div class="place"><b>[${f.type}]</b> ${f.message}<br><small>${f.contact||'연락처 없음'} · ${new Date(f.created_at).toLocaleString('ko-KR')}</small><select data-id="${f.id}"><option ${f.status==='new'?'selected':''}>new</option><option ${f.status==='reviewing'?'selected':''}>reviewing</option><option ${f.status==='done'?'selected':''}>done</option></select></div>`).join(''):'아직 접수된 피드백이 없어요.');feedbacks.querySelectorAll('select').forEach(el=>el.onchange=async()=>{await sb.from('feedbacks').update({status:el.value}).eq('id',el.dataset.id);renderFeedback()})}
document.querySelector('#place-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const row={id:Date.now(),name:f.get('name'),type:f.get('type'),status:'unverified',lat:Number(f.get('lat')),lng:Number(f.get('lng')),address:f.get('address')||null,category:f.get('category')||null};const {error}=await sb.from('places').insert(row);if(error)return alert(error.message);e.currentTarget.reset();render()};render();renderFeedback();
</script></body></html>
